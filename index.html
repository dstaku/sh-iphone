.bubble {
  box-sizing: border-box;
  position: relative;
  overflow: visible;
  max-width: 88%;
  width: fit-content;
  padding: 11px 15px;
  border-radius: 20px;
  font-size: 12px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  flex-shrink: 0;
}

.bubble.in {
  background: #ffffff;
  color: #111;
  align-self: flex-start;
  border-bottom-left-radius: 5px;
}

.bubble.out {
  background: #1684ff;
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 5px;
}

.bubble.in::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: -6px;
  width: 12px;
  height: 13px;
  background: #e5e5ea;
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.bubble.out::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: -6px;
  width: 12px;
  height: 13px;
  background: #1684ff;
  clip-path: polygon(0 0, 0 100%, 100% 100%);
}

  function renderWidget() {

    find('caGrid').style.gridTemplateRows =

    let cells = '';

    for (let i = 0; i < rows * 7; i++) {
      const date = new Date(y, m, i - offset + 1);
      const key = dateKey(date);
      const list = dayEvents(key);

      cells += `

  function openEditor(event) {
    editingId = event ? event.id : null;

    find('caEditorTitle').textContent =

    find('caTitleInput').value = event ? event.title : '';
    find('caDateInput').value = event ? event.date : selected;
    find('caTimeInput').value = event ? event.time || '' : '';
    find('caNoteInput').value = event ? event.note || '' : '';
    find('caDelete').hidden = !event;
    find('caEditor').hidden = false;
  }

  calendarButton.addEventListener('click', event => {
    event.stopPropagation();
    selected = BASE;
    month = new Date(2026, 10, 1);
    find('caEditor').hidden = true;

  });

  panel.addEventListener('click', event => {
    event.stopPropagation();

    const dateButton = event.target.closest('[data-date]');
    if (dateButton) {
      selected = dateButton.dataset.date;
      const date = parseDate(selected);
      month = new Date(date.getFullYear(), date.getMonth(), 1);
      renderCalendar();
      return;
    }

    const eventButton = event.target.closest('[data-event-id]');
    if (eventButton) {
      const item = events.find(e => e.id === eventButton.dataset.eventId);
      if (item) openEditor(item);
      return;
    }

    const actionButton = event.target.closest('[data-action]');
    if (!actionButton) return;

    switch (actionButton.dataset.action) {
      case 'close':
        panel.hidden = true;
        break;

      case 'today':
        selected = BASE;
        month = new Date(2026, 10, 1);
        renderCalendar();
        break;

      case 'prev':
      case 'next':
        month.setMonth(
          month.getMonth() +
          (actionButton.dataset.action === 'prev' ? -1 : 1)
        );
        renderCalendar();
        break;

      case 'add':
        openEditor(null);
        break;

      case 'cancel':
        find('caEditor').hidden = true;
        break;

      case 'delete':
        if (editingId && confirm('이 일정을 삭제할까요?')) {
          events = events.filter(e => e.id !== editingId);
          saveEvents();
          find('caEditor').hidden = true;
          renderCalendar();
          renderWidget();
        }
        break;
    }
  });

  find('caEditor').addEventListener('submit', event => {
    event.preventDefault();
    event.stopPropagation();

    const title = find('caTitleInput').value.trim();
    const date = find('caDateInput').value;
    if (!title || !date) return;

    const item = {
      id: editingId ||
        `event-${Date.now()}-${Math.random().toString(36).slice(2)}`,
      title,
      date,
      time: find('caTimeInput').value,
      note: find('caNoteInput').value.trim()
    };

    if (editingId) {
      events = events.map(e => e.id === editingId ? item : e);
    } else {
      events.push(item);
    }

    saveEvents();
    selected = date;

    const selectedDate = parseDate(date);
    month = new Date(
      selectedDate.getFullYear(),
      selectedDate.getMonth(),
      1
    );

    find('caEditor').hidden = true;
    renderCalendar();
    renderWidget();
  });

  /* 캘린더 조작을 기존 잠금/홈 스와이프와 분리 */
  [
    'touchstart', 'touchmove', 'touchend',
    'pointerdown', 'pointermove', 'pointerup',
    'mousedown', 'mousemove', 'mouseup'
  ].forEach(type => {
    panel.addEventListener(type, event => event.stopPropagation());
  });

  /* ===== 왼쪽 사진 위젯 유지 ===== */
  const photoInput = document.getElementById('widgetPhotoInput');
  const photo = document.getElementById('widgetPhoto');
  const hint = document.getElementById('widgetPhotoHint');

  let photoURL = '';

  if (photoInput && photo && hint) {
    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file || !file.type.startsWith('image/')) return;

      if (photoURL) URL.revokeObjectURL(photoURL);

      photoURL = URL.createObjectURL(file);
      photo.src = photoURL;
      photo.hidden = false;
      hint.hidden = true;
      photoInput.value = '';
    });
  }

  renderWidget();
})();
</script>
<script>
(() => {
  const phone = document.getElementById('phone');
  if (!phone) return;

  function updateStatusColor() {
    /* 기존 흰색 앱: 메시지·대화방 등 */
    const whiteAppOpen = [...phone.querySelectorAll('.app-screen.light.open')]
      .some(app =>
        !app.hidden &&
        !app.classList.contains('hidden') &&
        getComputedStyle(app).display !== 'none'
      );

    /* 새로 만든 캘린더 */
    const calendar = document.getElementById('miniCalendarApp');
    const calendarOpen = Boolean(calendar && !calendar.hidden);

    const shouldBeBlack = whiteAppOpen || calendarOpen;

    /* 기존 lightbar 감지 코드와 분리해서 충돌 방지 */
    if (phone.classList.contains('dark-status') !== shouldBeBlack) {
      phone.classList.toggle('dark-status', shouldBeBlack);
    }
  }

  const observer = new MutationObserver(updateStatusColor);

  observer.observe(phone, {
    subtree: true,
    childList: true,
    attributes: true,
    attributeFilter: ['class', 'hidden', 'style']
  });

  updateStatusColor();
})();
</script>

  function imageURL(value) {
    const url = String(value || '').trim();
    if (!url) return '';

    const match =
      url.match(/\/file\/d\/([^/?#]+)/) ||
      url.match(/[?&]id=([^&#]+)/);

    return match
      ? 'https://lh3.googleusercontent.com/d/' + match[1]
      : url;
  }

  /* 게시물 본문: 해시태그·아이디 색상 */
  function captionTextHTML(text) {
    const parts = String(text || '').split(
      /(@[A-Za-z0-9._]+|#[\p{L}\p{N}_]+)/gu
    );

    return parts.map(part => {
      if (part.startsWith('@')) {
        return (
          '<a href="#" data-caption-user="' +
          esc(part.slice(1)) +
          '" style="color:#00376b;text-decoration:none;">' +
          esc(part) +
          '</a>'
        );
      }

      if (part.startsWith('#')) {
        return (
          '<span style="color:#00376b;">' +
          esc(part) +
          '</span>'
        );
      }

      return esc(part);
    }).join('');
  }

  function feedCaptionHTML(post) {

    );
  }

  /* 긴 본문일 때만 더 보기 표시 */
  function updateCaptionMoreButtons() {
    root.querySelectorAll('[data-folded-caption]').forEach(box => {
      const body = box.querySelector('[data-caption-body]');
      const button = box.querySelector('[data-caption-more]');

      if (body && button) {
        button.style.display =
          body.scrollHeight > body.clientHeight + 1
            ? 'inline-block'
            : 'none';
      }
    });
  }

  new MutationObserver(function () {
    requestAnimationFrame(updateCaptionMoreButtons);
  }).observe(root, {
    childList: true,
    subtree: true,
  });

  window.addEventListener('resize', updateCaptionMoreButtons);

      const body = box.querySelector('[data-caption-body]');

    function findPostPerson(user) {
    return DATA.posts
      .flatMap(item => Array.isArray(item.tags) ? item.tags : [])
      .find(person => person.user === user);
  }

  function postAccount(index) {
    const post = DATA.posts[index];
    if (!post) return '';

    const person = findPostPerson(post.user);

    return (
      '<span class="sa-post-account"' +
        ' data-post-account="' + index + '">' +
        avatar('post-user-' + index) +
        '<strong>' +
          esc(post.user || '') +
          verifiedBadge(person) +
        '</strong>' +
      '</span>'
    );
  }

  root.addEventListener('click', function (event) {
    const account = event.target.closest('[data-post-account]');
    if (!account) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const post = DATA.posts[Number(account.dataset.postAccount)];
    if (!post) return;

    if (post.user === DATA.profile.name) {
      page = 'profile';
    } else {
      const person = findPostPerson(post.user);
      if (!person) return;

      selectedTagProfile = person;
      tagProfileBack = page;
      page = 'tagprofile';
    }

    render();
  }, true);

    function verifiedBadge(person) {
    return person?.verified
      ? '<b class="sa-verified-badge" aria-label="인증됨"></b>'
      : '';
  }


  function taggedProfile() {
        const person = DATA.posts
      .flatMap(post => Array.isArray(post.tags) ? post.tags : [])
      .find(item => item.user === selectedTagProfile?.user)
      || selectedTagProfile;

    if (!person) return profile();

    const ownPosts = DATA.posts
      .map((post, index) => ({ post, index }))
.filter(item =>
  item.post.user === person.user &&
  item.post.homeOnly !== true
);

    // 박성호 프로필의 HTML·클래스·숫자 위치를 그대로 사용
    const template = document.createElement('template');
    template.innerHTML = profile();

    const view = template.content;
    view.querySelector('.sa-body')
      ?.classList.add('sa-other-profile');

    // 상단 아이디와 뒤로 가기
    const head = view.querySelector('.sa-head');

    if (head) {
      const holder = document.createElement('template');

      holder.innerHTML = header(
                '<span class="sa-idname">' +
          esc(person.user || '') +
          verifiedBadge(person) +
        '</span>',

        '',
        true
      );

      head.replaceWith(holder.content);
    }

    // 프로필 사진: 위치와 크기는 원래 구조 유지
    const photoButton = view.querySelector(
      '.sa-profile-info > button'
    );

    if (photoButton) {
      photoButton.removeAttribute('data-photo');

      const url = imageURL(person.avatar || '');

      photoButton.innerHTML =
        '<span class="sa-avatar">' +
          (url
            ? '<img src="' + esc(url) + '" alt="프로필 사진">'
            : '<span>●</span>') +
        '</span>';
    }

    // 이름
    const name = view.querySelector('.sa-display-name');

    if (name) {
      name.textContent = person.name || '';
    }

    // 원래 숫자의 크기·이동값 유지, 내용만 변경
    const stats = view.querySelectorAll(
      '.sa-profile-stat-row .sa-stat strong'
    );

    const values = [
      person.postCount ?? ownPosts.length,
      person.followers ?? '0',
      person.following ?? '0',
    ];

        // 상대 프로필 숫자 위치: [좌우, 위아래]
        const numberPositions = person.user === 'mmyeongjh_'
      ? [
          [-10, 2], // ㅁㅈㅎ 게시물 숫자
          [-10, 2], // ㅁㅈㅎ 팔로워 숫자
          [-10, 2], // ㅁㅈㅎ 팔로잉 숫자
        ]
      : [
          [-10, 2], // 명재현 게시물 숫자
          [5.5, 2], // 명재현 팔로워 숫자
          [-4, 2], // 명재현 팔로잉 숫자
        ];


    stats.forEach(function (element, index) {
      element.textContent = String(values[index]);

      const position = numberPositions[index];

      element.style.setProperty(
        'position', 'relative', 'important'
      );
      element.style.setProperty(
        'display', 'inline-block', 'important'
      );
      element.style.setProperty('left', '0px', 'important');
      element.style.setProperty('top', '0px', 'important');
      element.style.setProperty(
        'transform',
        'translate(' + position[0] + 'px, ' + position[1] + 'px)',
        'important'
      );
    });

       if (person.user === 'mmyeongjh_') {
      const interest = view.querySelector('.sa-current-interest');

      if (interest) {
        interest.innerHTML =
          '<span>♡</span>' +
          '<span>현재 꽂힌 것: 😺</span>';
      }
    } else {
      view.querySelector('.sa-current-interest')?.remove();
    }


    // 명재현 프로필에만 공지방 표시
    if (person.user === PAPA.user) {
      const channel = document.createElement('button');

      channel.type = 'button';
      channel.className = 'papa-entry';
      channel.dataset.papaOpen = '';

      channel.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M8 15H5l-3 3V8a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v1"/>' +
          '<path d="M13 9h3a5 5 0 0 1 5 5v7l-3-2h-5a5 5 0 0 1 0-10Z"/>' +
        '</svg>' +
        '<strong>rrr</strong>' +
        '<span>멤버 ' + esc(PAPA.members) + '</span>';

      view.querySelector('.sa-profile-buttons')
        ?.insertAdjacentElement('beforebegin', channel);
    }

    // 소개
    const oldBio = view.querySelector('.sa-profile-bio');
    if (oldBio) oldBio.remove();

    if (person.bio) {
      const bio = document.createElement('div');
      bio.className = 'sa-profile-bio';
      bio.style.cssText =
        'padding:0 15px 12px;white-space:pre-wrap;';

      bio.textContent = person.bio;

      view.querySelector('.sa-profile-info')
        ?.insertAdjacentElement('afterend', bio);
    }

    // 팔로잉·메시지만 표시. 화살표·추가 버튼 없음
    const buttons = view.querySelector('.sa-profile-buttons');

    if (buttons) {
      buttons.innerHTML =
        '<button type="button">팔로잉</button>' +
        '<button type="button">메시지</button>';
    }

    // 하이라이트는 등록한 것만 표시. New 추가 버튼 없음
    const highlights = view.querySelector('.sa-highlights');

    if (highlights) {
      const items = Array.isArray(person.highlights)
        ? person.highlights
        : [];

      highlights.innerHTML = items.map(function (item) {
        const cover = imageURL(item.cover || '');

        return (
                    '<div role="button" tabindex="0" data-highlight-view="' +
            esc(JSON.stringify({
              user: person.user,
              avatar: imageURL(person.avatar || ''),
              title: item.title || '',
             positions: item.positions || [],
              images: Array.isArray(item.images) && item.images.length
                ? item.images.map(value => imageURL(value)).filter(Boolean)
                : (cover ? [cover] : []),
            })) + '">' +
            '<div class="sa-highlight">' +

              (cover
                ? '<img src="' + esc(cover) + '"' +
                    ' alt="하이라이트 표지"' +
                    ' style="width:100%;height:100%;' +
                    'object-fit:cover;border-radius:50%;">'
                : '') +
            '</div>' +
            esc(item.title || '') +
          '</div>'
        );
      }).join('');
    }

    // 해당 사람의 게시물만 표시
    const grid = view.querySelector('.sa-tiles');

    if (grid) {
      grid.innerHTML = ownPosts.map(function (item) {
        return photo(item.index, 'sa-tile');
      }).join('');
    }

    return template.innerHTML;
  }

    /* 실제 두벌식 키 순서와 한글 조합 */
  function kkBuildTyping(text) {
    const initial = [
      'ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ',
      'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ',
      'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'
    ];

    const vowels = [
      'ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ',
      'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ',
      'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'
    ];

    const finals = [
      '', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ',
      'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ',
      'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ',
      'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'
    ];

    const vowelParts = {
      'ㅘ': ['ㅗ', 'ㅏ'],
      'ㅙ': ['ㅗ', 'ㅐ'],
      'ㅚ': ['ㅗ', 'ㅣ'],
      'ㅝ': ['ㅜ', 'ㅓ'],
      'ㅞ': ['ㅜ', 'ㅔ'],
      'ㅟ': ['ㅜ', 'ㅣ'],
      'ㅢ': ['ㅡ', 'ㅣ']
    };

    const finalParts = {
      'ㄳ': ['ㄱ', 'ㅅ'],
      'ㄵ': ['ㄴ', 'ㅈ'],
      'ㄶ': ['ㄴ', 'ㅎ'],
      'ㄺ': ['ㄹ', 'ㄱ'],
      'ㄻ': ['ㄹ', 'ㅁ'],
      'ㄼ': ['ㄹ', 'ㅂ'],
      'ㄽ': ['ㄹ', 'ㅅ'],
      'ㄾ': ['ㄹ', 'ㅌ'],
      'ㄿ': ['ㄹ', 'ㅍ'],
      'ㅀ': ['ㄹ', 'ㅎ'],
      'ㅄ': ['ㅂ', 'ㅅ']
    };

    const shifted = {
      'ㄲ': 'ㄱ',
      'ㄸ': 'ㄷ',
      'ㅃ': 'ㅂ',
      'ㅆ': 'ㅅ',
      'ㅉ': 'ㅈ',
      'ㅒ': 'ㅐ',
      'ㅖ': 'ㅔ'
    };

    const steps = [];
    let committed = '';

    function addStep(value, key, mode = 'ko') {
      steps.push({
        value,
        key: shifted[key] || key,
        shift: Boolean(shifted[key]),
        mode
      });
    }

    function compose(first, vowel, last = '') {
      return String.fromCharCode(
        0xac00 +
        initial.indexOf(first) * 588 +
        vowels.indexOf(vowel) * 28 +
        finals.indexOf(last)
      );
    }

    for (const character of Array.from(text)) {
      const code = character.codePointAt(0);

      if (code >= 0xac00 && code <= 0xd7a3) {
        const offset = code - 0xac00;
        const first = initial[Math.floor(offset / 588)];
        const vowel = vowels[Math.floor((offset % 588) / 28)];
        const last = finals[offset % 28];

        addStep(committed + first, first);

        const vParts = vowelParts[vowel] || [vowel];

        vParts.forEach((part, index) => {
          const currentVowel = index === 0 ? part : vowel;

          addStep(
            committed + compose(first, currentVowel),
            part
          );
        });

        if (last) {
          const parts = finalParts[last] || [last];

          parts.forEach((part, index) => {
            const currentFinal = index === 0 ? part : last;

            addStep(
              committed + compose(first, vowel, currentFinal),
              part
            );
          });
        }

        committed += character;
      } else {
        committed += character;

        if (character === ' ') {
          addStep(committed, 'space');
        } else if (character === '\n') {
          addStep(committed, 'return');
        } else if (
          initial.includes(character) ||
          vowels.includes(character)
        ) {
          const parts = vowelParts[character] || [character];

          parts.forEach(part => {
            addStep(committed, part);
          });
        } else {
          addStep(committed, character, 'symbol');
        }
      }
    }

    return steps;
  }

      }
    }

    function tick() {
      if (!kkIsLive()) {
        kkLive.typing = false;
        kkLive.draft = '';
        return;
      }

      const step = steps[index];

      const nextMode =
        step.mode === 'symbol'
          ? 'symbol'
          : step.key === 'space' || step.key === 'return'
            ? currentMode
            : 'ko';

      if (nextMode !== currentMode) {
        const switchKey = nextMode === 'symbol' ? '123' : 'ABC';

        paintKeyboard(currentMode, switchKey);

        currentMode = nextMode;

        setTimeout(() => {
          if (!kkIsLive()) {
            kkLive.typing = false;
            kkLive.draft = '';
            return;
          }

          paintKeyboard(currentMode);
          setTimeout(tick, 140);
        }, 160);

        return;
      }

      kkLive.draft = step.value;
      kkPaintDraft();

      paintKeyboard(currentMode, step.key, step.shift);

      const draft = root.querySelector('[data-kk-draft]');

      if (draft) {
        draft.scrollTop = draft.scrollHeight;
      }

      const messages = root.querySelector('#kkMessages');

      if (messages) {
        messages.scrollTop = messages.scrollHeight;
      }

      index++;

      if (index < steps.length) {
        setTimeout(
          tick,
          step.key === 'space'
            ? 160
            : 90 + Math.random() * 65
        );
      } else {
        setTimeout(() => {
          kkLive.typing = false;

          if (!kkIsLive()) return;

          kkPaintDraft();
          paintKeyboard(currentMode);
        }, 150);
      }
    }

    setTimeout(tick, 300);
  }


  function kkAdvance() {
    if (!kkIsLive() || kkLive.busy) return;

    const next = kkLiveScript[kkLive.count];

    if (!next) return;

    if (next.out) {
      kkType();
      return;
    }

    kkLive.busy = true;

    setTimeout(() => {
      kkLive.busy = false;

      if (!kkIsLive()) return;

      kkLive.count++;
      kkRefresh();
      kkAdvance();
    }, 850 + Math.min(next.text.length * 30, 900));
  }

  const kkCallFinal = [
    '', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ',

  ];

  const kkCallVowelPairs = {
    'ㅗㅏ': 'ㅘ',
    'ㅗㅐ': 'ㅙ',

  function kkCallReady() {
    return (

  /* 누른 자음·모음을 실제 한글로 조합 */
  function kkCallCompose(keys) {
    let result = '';
    let index = 0;

    while (index < keys.length) {
      const first = keys[index];
      const firstIndex = kkCallInitial.indexOf(first);

      if (
        firstIndex < 0 ||
        !kkCallVowel.includes(keys[index + 1])
      ) {
        result += first;
        index++;
        continue;
      }

      let vowel = keys[index + 1];
      index += 2;

      const joinedVowel = kkCallVowelPairs[
        vowel + (keys[index] || '')
      ];

      if (joinedVowel) {
        vowel = joinedVowel;
        index++;
      }

      let final = '';
      const candidate = keys[index];

      if (
        candidate &&
        kkCallFinal.indexOf(candidate) > 0 &&
        !kkCallVowel.includes(keys[index + 1])
      ) {
        final = candidate;
        index++;

        const joinedFinal = kkCallFinalPairs[
          final + (keys[index] || '')
        ];

        if (
          joinedFinal &&
          !kkCallVowel.includes(keys[index + 1])
        ) {
          final = joinedFinal;
          index++;
        }
      }

      result += String.fromCharCode(
        0xac00 +
        firstIndex * 588 +
        kkCallVowel.indexOf(vowel) * 28 +
        kkCallFinal.indexOf(final)
      );
    }

    return result;
  }

  /*
   * 기존 클릭 처리보다 먼저 실행.
   * 대화가 끝나기 전에는 기존 동작 그대로.
   */
  root.addEventListener('click', event => {
    if (!kkCallReady()) return;

    const key = event.target.closest('[data-kk-key]');

    if (key) {
      event.preventDefault();
      event.stopImmediatePropagation();

      if (kkCallState.sent) return;

      const value = key.dataset.kkKey;

      if (value === 'shift') {
        kkCallState.shift = !kkCallState.shift;
        kkCallKeyboardPaint();
        return;
      }

      if (value === '123') {
        kkCallState.mode = 'symbol';
        kkCallKeyboardPaint();
        return;
      }

      if (value === 'ABC') {
        kkCallState.mode = 'ko';
        kkCallState.shift = false;
        kkCallKeyboardPaint();
        return;
      }

      if (value === 'emoji' || value === 'symbols') return;

      if (value === 'delete') {
        kkCallState.keys.pop();
      } else {
        const shiftMap = {
          'ㄱ': 'ㄲ',
          'ㄷ': 'ㄸ',
          'ㅂ': 'ㅃ',
          'ㅅ': 'ㅆ',
          'ㅈ': 'ㅉ',
          'ㅐ': 'ㅒ',
          'ㅔ': 'ㅖ'
        };

        const character =
          value === 'space'
            ? ' '
            : value === 'return'
              ? '\n'
              : kkCallState.shift
                ? shiftMap[value] || value
                : value;

        kkCallState.keys.push(character);
        kkCallState.shift = false;
      }

      kkLive.draft = kkCallCompose(kkCallState.keys);

      kkCallKeyboardPaint();
      kkCallPaint();

      return;
    }

    if (event.target.closest('[data-kk-send]')) {
      event.preventDefault();
      event.stopImmediatePropagation();

      const text = kkLive.draft.trim();

      if (!text || kkCallState.sent) return;

      const trigger =
        text.replace(/\s+/g, '') === '보고싶어';

      kkLiveScript.push({
        text,
        out: true
      });

      kkLive.count = kkLiveScript.length;
      kkLive.draft = '';

      kkCallState.keys = [];

      if (trigger) {
        kkCallState.sent = true;
        kkLive.keyboard = false;
      }

      kkRefresh();

      if (trigger) {
        setTimeout(kkCallShow, 1200);
      }

      return;
    }

    if (event.target.closest('[data-kk-open]')) {
      event.preventDefault();
      event.stopImmediatePropagation();

      if (kkCallState.sent) return;

      kkLive.keyboard = true;

      kkRefresh();
      kkCallKeyboardPaint();

      return;
    }
  }, true);

  root.addEventListener('pointerdown', event => {
    // 휴대폰·태블릿은 기존 터치 스와이프 사용
    if (event.pointerType !== 'mouse' || event.button !== 0) return;

        const album = event.target.closest('.sa-album-track');
    if (!album) return;

    // 사람 아이콘은 사진 드래그 대신 클릭으로 처리
    if (event.target.closest('[data-photo-tags]')) return;

    event.preventDefault();


    const startX = event.clientX;
    const startScroll = album.scrollLeft;
    const width = album.clientWidth;
    const startPage = Math.round(startScroll / width);

    album.setPointerCapture(event.pointerId);

    // 끄는 동안 사진이 손을 따라 움직이도록 설정
    const oldSnap = album.style.scrollSnapType;
    album.style.scrollSnapType = 'none';

    function move(moveEvent) {
      album.scrollLeft =
        startScroll - (moveEvent.clientX - startX);
    }

    function finish(endEvent) {
      album.removeEventListener('pointermove', move);
      album.removeEventListener('pointerup', finish);
      album.removeEventListener('pointercancel', finish);

      if (album.hasPointerCapture(event.pointerId)) {
        album.releasePointerCapture(event.pointerId);
      }

      const distance = startX - endEvent.clientX;
      const threshold = Math.min(60, width * 0.15);

      let nextPage = startPage;

      if (endEvent.type !== 'pointercancel') {
        if (distance > threshold) nextPage += 1;
        if (distance < -threshold) nextPage -= 1;
      }

      nextPage = Math.max(
        0,
        Math.min(album.children.length - 1, nextPage)
      );

      album.style.scrollSnapType = oldSnap;

      album.scrollTo({
        left: nextPage * width,
        behavior: 'smooth',
      });
    }

    album.addEventListener('pointermove', move);
    album.addEventListener('pointerup', finish);
    album.addEventListener('pointercancel', finish);
  });

        if (event.target !== dialog) return;

        const rect = dialog.getBoundingClientRect();

        if (
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom
        ) {
          dialog.close();
        }
      });

      dialog.addEventListener('close', function () {
        dialog.remove();
      }, { once: true });

            function fitCommentsToPhone() {
        const rect = root.getBoundingClientRect();
        const height = Math.round(rect.height * 0.72);

        dialog.style.setProperty('inset', 'auto', 'important');
        dialog.style.setProperty('margin', '0', 'important');
        dialog.style.setProperty('left', rect.left + 'px', 'important');
        dialog.style.setProperty(
          'top',
          (rect.bottom - height) + 'px',
          'important'
        );
        dialog.style.setProperty('width', rect.width + 'px', 'important');
        dialog.style.setProperty('max-width', 'none', 'important');
        dialog.style.setProperty('height', height + 'px', 'important');
        dialog.style.setProperty('max-height', 'none', 'important');
      }

      dialog.showModal();
      fitCommentsToPhone();

      window.addEventListener('resize', fitCommentsToPhone);

      dialog.addEventListener('close', function () {
        window.removeEventListener('resize', fitCommentsToPhone);
      }, { once: true });

      return;

    }



    if (action === 'like') {
      const index = Number(button.dataset.index);

      if (likes.has(index)) {
        likes.delete(index);
      } else {
        likes.add(index);
      }

      button.classList.toggle(
        'sa-liked',
        likes.has(index)
      );

      return;
    }

    if (action === 'savepost') {
      button.style.color =
        button.style.color ? '' : '#9370db';
      return;
    }

    if (action === 'share') {
      if (navigator.clipboard) {
        navigator.clipboard
          .writeText(DATA.profile.name)
          .then(() => alert('프로필 이름을 복사했습니다.'))
          .catch(() => alert(DATA.profile.name));
      } else {
        alert(DATA.profile.name);
      }

      return;
    }

    if (['call', 'video', 'attach'].includes(action)) {
      alert(
        '이 화면은 UI 시뮬레이션입니다. ' +
        '실제 통화·사진 전송은 연결하지 않았습니다.'
      );
      return;
    }

    if (
['feed', 'reels', 'inbox', 'profile', 'dc', 'notifications']
        .includes(action)
    ) {
      page = action;
      render();
    }
  });

  /* ===== 메시지 전송 / 내용 편집 저장 ===== */

  root.addEventListener('submit', event => {
    event.preventDefault();
    event.stopPropagation();

    if (event.target.id === 'saSendForm') {
      const input = root.querySelector('#saMessageInput');
      const text = input.value.trim();

      if (text) {
             const isOut = root.querySelector('#saSide').value === 'out';
        window.saSideOut = isOut;

        messages[activeChat].push({
          out: isOut,
          text
        });

        render();
        root.querySelector('#saMessageInput').focus();
      }
    }

    if (event.target.id === 'saEditor') {
      try {
        const value = JSON.parse(
          root.querySelector('#saDataEditor').value
        );

        if (
          !value.profile ||
          !Array.isArray(value.posts) ||
          !Array.isArray(value.chats) ||
          !Array.isArray(value.dc) ||
          !value.chats.length
        ) {
          throw new Error();
        }

        if (
          !value.posts.every(
            post => post && typeof post.user === 'string'
          ) ||
          !value.chats.every(
            chat => chat && typeof chat.name === 'string'
          ) ||
          !value.dc.every(
            post => post && typeof post.title === 'string'
          )
        ) {
          throw new Error();
        }

        Object.assign(DATA, value);

        while (messages.length < DATA.chats.length) {
          messages.push([]);
        }

        activeChat = Math.min(
          activeChat,
          DATA.chats.length - 1
        );

        if (page === 'dcpost' && !DATA.dc[dcIndex]) {
          page = 'dc';
        }

        render();
      } catch (_) {
        alert(
          '입력 형식을 확인해 주세요. ' +
          'profile, posts, chats, dc 구조와 ' +
          '따옴표·쉼표를 유지해야 합니다.'
        );
      }
    }
  });

  /* ===== 검색 ===== */

  root.addEventListener('input', event => {
    if (event.target.id === 'saChatSearch') {
      const query = event.target.value.toLowerCase();

      root.querySelectorAll('.sa-chat-row').forEach(row => {
        row.hidden =
          !row.textContent.toLowerCase().includes(query);
      });
    }

    if (event.target.id === 'saSearch') {
      const query = event.target.value.toLowerCase();

      root.querySelectorAll('.sa-tile').forEach((tile, index) => {
        const text =
          DATA.posts[index].user + ' ' +
          DATA.posts[index].caption;

        tile.style.display =
          text.toLowerCase().includes(query) ? '' : 'none';
      });
    }
  });

  root.addEventListener('keydown', event => {
    const photoElement = event.target.closest('[data-photo]');

    if (
      photoElement &&
      (event.key === 'Enter' || event.key === ' ')
    ) {
      event.preventDefault();
      pick(photoElement.dataset.photo);
    }
  });

  /* 기존 홈/잠금 스와이프와 분리 */
  [
    'touchstart',
    'touchmove',
    'touchend',
    'pointerdown',
    'pointermove',
    'pointerup',
    'mousedown',
    'mousemove',
    'mouseup'
  ].forEach(type => {
    root.addEventListener(type, event => {
      event.stopPropagation();
    });
  });

  /* 기존 홈의 인스타·디시 아이콘에 연결 */
  document.addEventListener('click', event => {
    const app = event.target.closest('#home .app[data-id]');

    if (
      !app ||
!['instagram', 'dcinside', 'twitter', 'kakaotalk'].includes(app.dataset.id)
    ) {
      return;
    }

    event.preventDefault();
    event.stopImmediatePropagation();

    page = app.dataset.id === 'kakaotalk'
      ? 'kakao'
      : app.dataset.id === 'instagram'
        ? 'feed'
        : app.dataset.id === 'twitter'
          ? 'twitter'
          : 'dc';

    root.hidden = false;
    render();
  }, true);
  // 새로고침 전에 현재 인스타 화면 기억
  window.addEventListener('pagehide', () => {
    try {
      if (root.hidden) {
        sessionStorage.removeItem('lastSocialView');
        return;
      }

      sessionStorage.setItem('lastSocialView', JSON.stringify({
        page,
        activeChat,
        igIndex,
        igBack,
        dcIndex,
        selectedTagProfile,
        tagProfileBack,
      }));
    } catch (error) {}
  });

  // 새로고침 후 그 화면으로 바로 복귀
  try {
    const saved = JSON.parse(
      sessionStorage.getItem('lastSocialView') || 'null'
    );

    if (saved) {
      page = saved.page;
      activeChat = saved.activeChat;
      igIndex = saved.igIndex;
      igBack = saved.igBack;
      dcIndex = saved.dcIndex;
      selectedTagProfile = saved.selectedTagProfile;
      tagProfileBack = saved.tagProfileBack;

      phone.classList.add('unlocked');
      phone.classList.remove('passmode');

      document.getElementById('pass').classList.remove('show');
      document.getElementById('lock').classList.add('up');
      document.getElementById('home').classList.remove('hidden');
      document.getElementById('wall').classList.add('blur');

      root.hidden = false;
      render();
    }
  } catch (error) {}

  const homeBar = document.getElementById('homeBar');

  if (homeBar) {
    homeBar.addEventListener('click', () => {
      if (!root.hidden) close();
    }, true);
  }
})();
</script>

<script>
(function () {
  const phone = document.getElementById('phone');
  const social = document.getElementById('socialApps');
  const msg = document.getElementById('msgApp');
  const cal = document.getElementById('miniCalendarApp');
  const bar = document.getElementById('homeBar');
  if (!phone) return;

  let sx = 0, sy = 0, on = false;

  function appOpen() {
        const music = document.getElementById('dreamMusicApp');
    if (music && !music.hidden) return 'music';

    if (social && !social.hidden) return 'social';
    if (cal && !cal.hidden) return 'cal';
    if (msg && msg.classList.contains('open')) return 'msg';
    return '';
  }

  function resetStyle(el) {
    el.style.transition = 'none';
    el.style.transform = '';
    el.style.opacity = '';
    el.style.borderRadius = '';
    el.style.transformOrigin = '';
    el.style.visibility = '';
    void el.offsetWidth;
    el.style.transition = '';
  }

  function shrink(el, done, wait) {
    el.style.transition = 'transform .3s ease, opacity .3s ease, border-radius .3s ease';
    el.style.transformOrigin = 'center center';
    el.style.transform = 'scale(.8)';
    el.style.opacity = '0';
    el.style.borderRadius = '40px';
    setTimeout(() => {
      el.style.visibility = 'hidden';
      done();
      setTimeout(() => resetStyle(el), wait);
    }, 300);
  }

   function startAppSwipe(x, y, target) {
    if (!appOpen()) {
      on = false;
      return;
    }

    const r = phone.getBoundingClientRect();

    // 화면 맨 아래 32px 또는 홈 막대에서 시작할 때만 닫기
    on = x > r.left && x < r.right &&
      (
        (y >= r.bottom - 32 && y <= r.bottom) ||
        !!target.closest('#homeBar')
      );

    sx = x;
    sy = y;
  }

  function finishAppSwipe(x, y) {
    if (!on) return;
    on = false;

    if (sy - y < 45 || Math.abs(x - sx) > 100) return;

    const app = appOpen();

    if (app === 'music') {
      const music = document.getElementById('dreamMusicApp');
      shrink(music, () => {
        music.hidden = true;
      }, 50);
    } else if (app === 'social') {
      shrink(social, () => {
        social.hidden = true;
        phone.classList.remove('social-black', 'social-white');
      }, 50);
    } else if (app === 'cal') {
      shrink(cal, () => {
        cal.hidden = true;
      }, 50);
    } else if (app === 'msg') {
      shrink(msg, () => {
        bar.click();
      }, 700);
    }
  }

  window.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) {
      on = false;
      return;
    }

    const touch = e.touches[0];
    startAppSwipe(touch.clientX, touch.clientY, e.target);
  }, { capture: true, passive: true });

  window.addEventListener('touchmove', e => {
    if (on && e.cancelable) e.preventDefault();
  }, { capture: true, passive: false });

  window.addEventListener('touchend', e => {
    const touch = e.changedTouches[0];
    if (touch) finishAppSwipe(touch.clientX, touch.clientY);
  }, { capture: true, passive: true });

  window.addEventListener('touchcancel', () => {
    on = false;
  }, true);

  // PC에서는 마우스 드래그로 닫기
  window.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    startAppSwipe(e.clientX, e.clientY, e.target);
  }, true);

  window.addEventListener('pointerup', e => {
    if (e.pointerType !== 'mouse') return;
    finishAppSwipe(e.clientX, e.clientY);
  }, true);

})();
</script>

<script>
(function () {
  let activeClose = null;

  function openHighlight(data) {
    if (!Array.isArray(data.images) || !data.images.length) return;

    if (activeClose) activeClose();

    const root = document.getElementById('socialApps');
    if (!root) return;

    const viewer = document.createElement('div');
    viewer.id = 'highlightViewer';
    viewer.setAttribute('role', 'dialog');
    viewer.setAttribute('aria-label', '하이라이트');

    viewer.innerHTML = `
      <img class="hv-photo" alt="하이라이트 사진">

      <div class="hv-top">
        <div class="hv-bars"></div>

        <div class="hv-head">
          <img class="hv-avatar" alt="프로필">
          <strong></strong>
          <span class="hv-title"></span>

          <button
            type="button"
            class="hv-pause"
            aria-label="일시정지"
          >Ⅱ</button>

          <button
            type="button"
            class="hv-close"
            aria-label="닫기"
          >×</button>
        </div>
      </div>

      <button
        type="button"
        class="hv-hit hv-prev"
        aria-label="이전 사진"
      ></button>

      <button
        type="button"
        class="hv-hit hv-next"
        aria-label="다음 사진"
      ></button>
    `;

        document.body.appendChild(viewer);


    viewer.querySelector('strong').hidden = true;
    viewer.querySelector('.hv-title').textContent = data.title || '';

    const avatar = viewer.querySelector('.hv-avatar');

    if (data.avatar) {
      avatar.src = data.avatar;
    } else {
      avatar.hidden = true;
    }

    const bars = viewer.querySelector('.hv-bars');

    data.images.forEach(function () {
      const bar = document.createElement('div');
      bar.className = 'hv-bar';
      bar.innerHTML = '<div class="hv-fill"></div>';
      bars.appendChild(bar);
    });

    const fills = Array.from(bars.querySelectorAll('.hv-fill'));
    const image = viewer.querySelector('.hv-photo');
           const video = document.createElement('video');

    video.playsInline = true;
    video.muted = true;
    video.autoplay = true;
    video.controls = false;
    video.preload = 'auto';

    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('muted', '');

    Object.assign(video.style, {
      position: 'absolute',
      inset: '0',
      width: '100%',
      height: '100%',
      objectFit: 'cover',
      display: 'none',
      background: '#000',
      pointerEvents: 'none',
    });

    viewer.insertBefore(video, viewer.firstChild);


    const pauseButton = viewer.querySelector('.hv-pause');

    let index = 0;
    let elapsed = 0;
    let previous = performance.now();
    let frame = 0;
    let ready = false;
    let paused = false;
    let closed = false;

    function fit() {
      const rect = root.getBoundingClientRect();

      Object.assign(viewer.style, {
        position: 'fixed',
        inset: 'auto',
        left: rect.left + 'px',
        top: rect.top + 'px',
        right: 'auto',
        bottom: 'auto',
        width: rect.width + 'px',
        height: rect.height + 'px',
        maxWidth: 'none',
        maxHeight: 'none',
        boxSizing: 'border-box',
        borderRadius: getComputedStyle(root).borderRadius,
        overflow: 'hidden',
        zIndex: '2147483647',
      });
    }



    function close() {
      if (closed) return;

      closed = true;
      cancelAnimationFrame(frame);
      window.removeEventListener('resize', fit);
      document.removeEventListener('keydown', handleKeys);
      viewer.remove();
      activeClose = null;
    }

       function show(nextIndex) {
      video.pause();
      video.onended = null;
      video.ontimeupdate = null;
      video.removeAttribute('src');
      video.load();

      if (nextIndex >= data.images.length) {
        close();
        return;
      }

      index = Math.max(0, nextIndex);
      elapsed = 0;
      ready = false;

      fills.forEach(function (fill, fillIndex) {
        fill.style.width = fillIndex < index ? '100%' : '0%';
      });

      const url = data.images[index];
      const isVideo = /\.mp4(?:[?#]|$)/i.test(url);

      viewer.querySelector('.hv-prev').style.display = '';
      viewer.querySelector('.hv-next').style.display = '';

      if (isVideo) {
        image.onload = null;
        image.onerror = null;
        image.removeAttribute('src');
        image.style.display = 'none';

        video.style.display = 'block';
        video.src = url;

        // 영상 길이에 맞춰 상단 진행 막대 표시
        video.ontimeupdate = function () {
          if (Number.isFinite(video.duration) && video.duration > 0) {
            fills[index].style.width =
              Math.min(100, video.currentTime / video.duration * 100) + '%';
          }
        };

        // 영상이 끝나면 다음 장, 마지막이면 닫기
        video.onended = function () {
          show(index + 1);
        };

        video.play().catch(function () {
          // 자동 재생이 제한되면 영상을 눌러 재생
          video.controls = true;
          video.style.pointerEvents = 'auto';
          viewer.querySelector('.hv-prev').style.display = 'none';
          viewer.querySelector('.hv-next').style.display = 'none';
        });
      } else {
        video.style.display = 'none';
        video.controls = false;
        video.style.pointerEvents = 'none';

        image.style.display = 'block';

        image.onload = function () {
          ready = true;
          previous = performance.now();
        };

        image.onerror = function () {
          ready = true;
          previous = performance.now();
        };
        image.style.objectPosition =
          data.positions?.[index] || '50% 50%';

        image.src = url;
      }
    }


    image.onload = function () {
      ready = true;
      previous = performance.now();
    };

    image.onerror = function () {
      ready = true;
      previous = performance.now();
    };

    function handleKeys(event) {
      if (event.key === 'Escape') close();
      if (event.key === 'ArrowRight') show(index + 1);
      if (event.key === 'ArrowLeft') show(index - 1);
    }

    viewer.querySelector('.hv-close').onclick = close;

    viewer.querySelector('.hv-next').onclick = function () {
      show(index + 1);
    };

    viewer.querySelector('.hv-prev').onclick = function () {
      show(index - 1);
    };

    pauseButton.onclick = function () {
      paused = !paused;
      this.textContent = paused ? '▶' : 'Ⅱ';
      this.setAttribute('aria-label', paused ? '재생' : '일시정지');
    };

    function tick(now) {
      if (closed) return;

      const delta = now - previous;
      previous = now;

      if (ready && !paused && !document.hidden) {
        elapsed += Math.min(delta, 100);

        fills[index].style.width =
          Math.min(100, elapsed / 150) + '%';

        if (elapsed >= 15000) {
          show(index + 1);
        }
      }

      if (!closed) {
        frame = requestAnimationFrame(tick);
      }
    }

    activeClose = close;
    fit();

    window.addEventListener('resize', fit);
    document.addEventListener('keydown', handleKeys);

    show(0);
    frame = requestAnimationFrame(tick);
  }

  document.addEventListener('click', function (event) {
    const item = event.target.closest('[data-highlight-view]');
    if (!item) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    try {
      openHighlight(JSON.parse(item.dataset.highlightView));
    } catch (error) {
      console.error(error);
    }
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;

    const item = event.target.closest('[data-highlight-view]');

    if (item) {
      event.preventDefault();
      item.click();
    }
  });
})();
</script>

          </svg>
          보관함
        </span>

        <span class="dream-tab">
          <svg viewBox="0 0 24 24">
            <circle cx="10" cy="10" r="7"/>
            <path d="m15 15 6 6"/>
          </svg>
          검색
        </span>
      </div>

    
    </div>
  `;

  phone.appendChild(app);

  // MP4를 넣어도 영상 없이 소리만 재생
  const audio = new Audio();
  audio.preload = 'none';

  let current = -1;

  const playButton = app.querySelector('.dream-play');
  const nowTitle = app.querySelector('.dream-now');
  const miniCover = app.querySelector('.dream-mini-cover');
  const errorBox = app.querySelector('.dream-error');

  function updatePlayer() {
    playButton.textContent = audio.paused ? '▶' : 'Ⅱ';
    playButton.setAttribute(
      'aria-label',
      audio.paused ? '재생' : '일시정지'
    );

    app.querySelectorAll('[data-song]').forEach(button => {
      button.classList.toggle(
        'is-playing',
        Number(button.dataset.song) === current
      );
    });
  }

  function showError() {
    errorBox.textContent = '재생할 수 없어요. 음악 링크를 확인해 주세요.';
    errorBox.hidden = false;
  }

  function startSong(index) {
    const song = SONGS[index];
    if (!song) return;

    if (!song.src) {
      showError();
      return;
    }

    errorBox.hidden = true;

    if (current !== index) {
      current = index;
      audio.src = song.src;
      nowTitle.textContent = song.title || '';
      miniCover.innerHTML = picture(song.cover || ALBUM.cover);
    }

    audio.play().catch(showError);
    updatePlayer();
  }

  function closeMusic() {
    app.hidden = true;
  }

  // 기존 홈 화면 음악 아이콘 연결
  document.addEventListener('click', event => {
    const musicIcon = event.target.closest(
      '#home .app[data-id="music"]'
    );

    if (!musicIcon) return;

    event.preventDefault();
    event.stopImmediatePropagation();
    app.hidden = false;
  }, true);

  app.addEventListener('click', event => {
    const songButton = event.target.closest('[data-song]');

    if (songButton) {
      startSong(Number(songButton.dataset.song));
      return;
    }

    const button = event.target.closest('[data-dream]');
    if (!button) return;

    const action = button.dataset.dream;

    if (action === 'close') {
      closeMusic();
    }

    if (action === 'play') {
      if (current < 0) {
        if (SONGS.length) startSong(0);
      } else if (audio.paused) {
        errorBox.hidden = true;
        audio.play().catch(showError);
      } else {
        audio.pause();
      }
    }

    if (action === 'next' && SONGS.length) {
      startSong((current + 1) % SONGS.length);
    }
  });

  audio.addEventListener('play', updatePlayer);
  audio.addEventListener('pause', updatePlayer);
  audio.addEventListener('error', showError);

  audio.addEventListener('ended', () => {
    if (current + 1 < SONGS.length) {
      startSong(current + 1);
    } else {
      updatePlayer();
    }
  });
})();
</script>

<script>
(() => {
  const phone = document.getElementById('phone');
  if (!phone) return;

 function fitPhoneToScreen() {
  const viewport = window.visualViewport;
  const width = viewport ? viewport.width : window.innerWidth;
  const height = viewport ? viewport.height : window.innerHeight;
  const offsetLeft = viewport ? viewport.offsetLeft : 0;
  const offsetTop = viewport ? viewport.offsetTop : 0;

  if (window.innerWidth >= 600) {
    phone.style.position = '';
    phone.style.inset = '';
    phone.style.left = '';
    phone.style.top = '';
    phone.style.width = '';
    phone.style.height = '';
    phone.style.transform = '';
    return;
  }

  const scale = width / 390;

  phone.style.width = '390px';
  phone.style.height = `${height / scale}px`;
  phone.style.position = 'fixed';
  phone.style.inset = 'auto';
  phone.style.left = `${offsetLeft + width / 2}px`;
  phone.style.top = `${offsetTop + height / 2}px`;
  phone.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}


})();
</script>
